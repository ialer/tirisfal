name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tirisfal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health + register + login)
        run: |
          mkdir -p docker/secrets
          printf 'JWT_SECRET=%s\nENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -base64 32)" > docker/secrets/dev.vars
          chmod 600 docker/secrets/dev.vars
          # 容器以 uid 10001 运行，runner 创建的文件属主是 1001，必须改属主否则 entrypoint 读不到
          sudo chown 10001:10001 docker/secrets/dev.vars
          docker run -d --name tirisfal-ci -p 8787:8787 -v "$PWD/docker/secrets/dev.vars:/run/secrets/dev.vars:ro" tirisfal:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health | grep -q '"status":"healthy"'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          # 信任链回归：非回环 Host 且无客户端 IP 头时必须 403（fail-closed）；
          # 带头（镜像内 TRUST_CLIENT_IP_HEADER=1）时放行，防止「已经默认信任伪造头」回归
          HOST_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tirisfal-ci)
          # 用非回环地址访问，避免 workerd 把 127.0.0.1 当本地回退而掩盖信任链问题
          NEG=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "http://${HOST_IP}:8787/api/accounts/register")
          echo "no-ip status=$NEG (expect 4xx: fail-closed)"
          case "$NEG" in 403|429) ;; *) echo "unexpected status $NEG"; exit 1 ;; esac
          POS=$(curl -s -o /dev/null -w '%{http_code}' -H 'CF-Connecting-IP: 203.0.113.7' "http://${HOST_IP}:8787/api/health")
          echo "with-ip status=$POS (expect 200)"
          test "$POS" = "200"
          HASH='q83vEjRWeJq83vEjRWeJq83vEjRWeJq83vEjRWeJq80='
          curl -fsS -X POST http://127.0.0.1:8787/api/accounts/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"name\":\"CI\",\"masterPasswordHash\":\"${HASH}\",\"key\":\"2.aaaaaaaaaaaa|bbbbbbbbbbbb\",\"keys\":{\"encryptedPrivateKey\":\"2.cccccccccc|dddddddddddd\",\"publicKey\":\"xx\"}}" \
            | grep -q '"success":true'
          curl -fsS -X POST http://127.0.0.1:8787/identity/connect/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data "grant_type=password&username=ci@example.com&password=${HASH}&deviceType=1&deviceIdentifier=ci&deviceName=ci" \
            | grep -q access_token
      - name: Container logs on failure
        if: failure()
        run: docker logs tirisfal-ci || true
      - name: Stop
        if: always()
        run: docker rm -f tirisfal-ci || true

  push:
    name: Push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
