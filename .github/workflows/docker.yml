name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tirisfal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health + register + login)
        run: |
          mkdir -p docker/secrets
          printf 'JWT_SECRET=%s\nENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -base64 32)" > docker/secrets/dev.vars
          chmod 600 docker/secrets/dev.vars
          # 容器以 uid 10001 运行，runner 创建的文件属主是 1001，必须改属主否则 entrypoint 读不到
          sudo chown 10001:10001 docker/secrets/dev.vars
          docker run -d --name tirisfal-ci -p 8787:8787 -v "$PWD/docker/secrets/dev.vars:/run/secrets/dev.vars:ro" tirisfal:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health | grep -q '"status":"healthy"'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          # 信任链回归：非回环 Host 且无客户端 IP 头时必须 403（fail-closed）；
          # 带头（镜像内 TRUST_CLIENT_IP_HEADER=1）时放行，防止「已经默认信任伪造头」回归
          # 信任链（无 IP 时 fail-closed）由 tests/utils/client-ip.test.ts 覆盖：
          # 容器内 workerd 无法稳定模拟非回环来源，CI 只做健康/注册/登录冒烟
          HASH='q83vEjRWeJq83vEjRWeJq83vEjRWeJq83vEjRWeJq80='
          curl -fsS -X POST http://127.0.0.1:8787/api/accounts/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"name\":\"CI\",\"masterPasswordHash\":\"${HASH}\",\"key\":\"2.aaaaaaaaaaaa|bbbbbbbbbbbb\",\"keys\":{\"encryptedPrivateKey\":\"2.cccccccccc|dddddddddddd\",\"publicKey\":\"xx\"}}" \
            | grep -q '"success":true'
          curl -fsS -X POST http://127.0.0.1:8787/identity/connect/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data "grant_type=password&username=ci@example.com&password=${HASH}&deviceType=1&deviceIdentifier=ci&deviceName=ci" \
            | grep -q access_token
      - name: Container logs on failure
        if: failure()
        run: docker logs tirisfal-ci || true
      - name: Stop
        if: always()
        run: docker rm -f tirisfal-ci || true

  push:
    name: Push to GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
