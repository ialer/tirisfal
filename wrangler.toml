name = "tirisfal"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare 边缘会强制覆盖客户端 IP 头，显式开启信任（自托管见 docs/DOCKER.md）
[vars]
TRUST_CLIENT_IP_HEADER = "1"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = false

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "tirisfal-db"
database_id = "19134230-2817-4e34-9c29-04168ddb35bb"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "tirisfal-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]
